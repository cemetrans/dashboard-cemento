<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Cemento · Auto-Excel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c10">
  <link rel="manifest" href="manifest.json">

  <!-- Bootstrap / FontAwesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- XLSX (lector Excel) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    body { background:#0b0c10; color:#c5c6c7; font-family:system-ui; }
    .navbar { background:#1f2833; border-bottom:1px solid #45a29e33; }
    .card { background:#1f2833; border:1px solid #45a29e33; }
    .kpi-card { background:#1f2833; border:1px solid #45a29e; border-radius:8px; padding:12px 16px; }
    .kpi-value { font-size:2rem; font-weight:600; color:#66fcf1; }
    .kpi-label { font-size:0.9rem; text-transform:uppercase; }
    .chart-container { height:260px; }
    .table thead { background:#1f2833; color:#66fcf1; }
    .form-select, .form-control { background:#0b0c10; border:1px solid #45a29e55; color:#c5c6c7; }
    #offlineBanner { display:none; background:#e74c3c; color:white; padding:8px; text-align:center; }
    @media(max-width:768px){
      .chart-container{height:320px!important;}
      .kpi-value{font-size:1.8rem;}
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark px-3">
  <a class="navbar-brand d-flex align-items-center">
    <i class="fa-solid fa-chart-line me-2 text-info"></i>
    Dashboard Cemento · Auto-Excel
  </a>
</nav>

<div id="offlineBanner">Modo offline activado</div>

<div class="container-fluid py-3">

  <!-- KPIs -->
  <div class="row g-3 mb-3">
    <div class="col-12 col-md-3"><div class="kpi-card"><div class="kpi-label">Toneladas</div><div id="kpiToneladas" class="kpi-value">0</div></div></div>
    <div class="col-12 col-md-3"><div class="kpi-card"><div class="kpi-label">Importe</div><div id="kpiImporte" class="kpi-value">0 €</div></div></div>
    <div class="col-12 col-md-3"><div class="kpi-card"><div class="kpi-label">Albaranes</div><div id="kpiAlbaranes" class="kpi-value">0</div></div></div>
    <div class="col-12 col-md-3"><div class="kpi-card"><div class="kpi-label">Ticket medio</div><div id="kpiTicketMedio" class="kpi-value">0 €</div></div></div>
  </div>

  <!-- Filtros -->
  <div class="card mb-3">
    <div class="card-header">Filtros</div>
    <div class="card-body">
      <div class="row g-2">
        <div class="col-md-3"><select id="filtroCentro" class="form-select"><option value="">Centro</option></select></div>
        <div class="col-md-3"><select id="filtroEmpresa" class="form-select"><option value="">Empresa</option></select></div>
        <div class="col-md-3"><select id="filtroObra" class="form-select"><option value="">Obra</option></select></div>
        <div class="col-md-3"><select id="filtroFamilia" class="form-select"><option value="">Familia</option></select></div>
      </div>
    </div>
  </div>

  <!-- Gráficos -->
  <div class="row g-3 mb-3">
    <div class="col-lg-6"><div class="card"><div class="card-header">Toneladas por día</div><div class="card-body"><div class="chart-container"><canvas id="chartToneladasDia"></canvas></div></div></div></div>
    <div class="col-lg-6"><div class="card"><div class="card-header">Importe por día</div><div class="card-body"><div class="chart-container"><canvas id="chartImporteDia"></canvas></div></div></div></div>
  </div>

  <!-- Tabla -->
  <div class="card">
    <div class="card-header">Detalle</div>
    <div class="card-body table-responsive">
      <table class="table table-dark table-sm">
        <thead>
          <tr>
            <th>Fecha</th><th>Albarán</th><th>Obra</th><th>Centro</th><th>Artículo</th>
            <th>Familia</th><th>Cantidad</th><th>Unidades</th><th>Importe</th><th>Empresa</th>
          </tr>
        </thead>
        <tbody id="tablaBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const EXCEL_URL =
  "https://docs.google.com/spreadsheets/d/1M0D0e4lxJxqubcedNQ6I_sCTNuAGwTRD/export?format=xlsx";

let rawData = [];
let filteredData = [];

async function cargarExcelDesdeNube() {
  try {
    const response = await fetch(EXCEL_URL);
    const buffer = await response.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: "array" });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    rawData = XLSX.utils.sheet_to_json(sheet, { defval: "" });

    filteredData = [...rawData];
    iniciarDashboard();

    console.log("Excel cargado automáticamente desde Google Sheets");
  } catch (err) {
    console.error("Error cargando Excel:", err);
  }
}

window.addEventListener("DOMContentLoaded", cargarExcelDesdeNube);

function iniciarDashboard() {
  populateFilters();
  attachFilterEvents();
  applyFilters();
  initCharts();
}

function populateFilters() {
  const centros = new Set();
  const empresas = new Set();
  const obras = new Set();
  const familias = new Set();

  rawData.forEach(r => {
    if (r.Centro) centros.add(r.Centro);
    if (r.Empresa) empresas.add(r.Empresa);
    if (r.Obra) obras.add(r.Obra);
    if (r.Familia) familias.add(r.Familia);
  });

  fillSelect("filtroCentro", centros);
  fillSelect("filtroEmpresa", empresas);
  fillSelect("filtroObra", obras);
  fillSelect("filtroFamilia", familias);
}

function fillSelect(id, set) {
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="">Todos</option>';
  set.forEach(v => sel.innerHTML += `<option>${v}</option>`);
}

function attachFilterEvents() {
  ["filtroCentro","filtroEmpresa","filtroObra","filtroFamilia"].forEach(id => {
    document.getElementById(id).addEventListener("change", applyFilters);
  });
}

function applyFilters() {
  const centro = document.getElementById("filtroCentro").value || "";
  const empresa = document.getElementById("filtroEmpresa").value || "";
  const obra = document.getElementById("filtroObra").value || "";
  const familia = document.getElementById("filtroFamilia").value || "";

  filteredData = rawData.filter(r =>
    (!centro  || r.Centro  === centro) &&
    (!empresa || r.Empresa === empresa) &&
    (!obra    || r.Obra    === obra) &&
    (!familia || r.Familia === familia)
  );

  updateKPIs();
  renderTable();
  initCharts();
}

function updateKPIs() {
  const toneladas = filteredData
    .filter(r => r.Unidades === "T")
    .reduce((s, r) => s + (Number(r.Cantidad) || 0), 0);

  const importe = filteredData
    .reduce((s, r) => s + (Number(r.Importe) || 0), 0);

  document.getElementById("kpiToneladas").textContent = toneladas.toFixed(2);
  document.getElementById("kpiImporte").textContent = importe.toFixed(2) + " €";
  document.getElementById("kpiAlbaranes").textContent = filteredData.length;
  document.getElementById("kpiTicketMedio").textContent =
    filteredData.length ? (importe / filteredData.length).toFixed(2) + " €" : "0 €";
}

function renderTable() {
  const tbody = document.getElementById("tablaBody");
  tbody.innerHTML = "";
  filteredData.forEach(r => {
    tbody.innerHTML += `
      <tr>
        <td>${r.Fecha || ""}</td>
        <td>${r.Albaran || r.Albarán || ""}</td>
        <td>${r.Obra || ""}</td>
        <td>${r.Centro || ""}</td>
        <td>${r.Articulo || r.Artículo || ""}</td>
        <td>${r.Familia || ""}</td>
        <td>${r.Cantidad || 0}</td>
        <td>${r.Unidades || ""}</td>
        <td>${r.Importe || 0}</td>
        <td>${r.Empresa || ""}</td>
      </tr>`;
  });
}

let chartT = null;
let chartI = null;

function initCharts() {
  const ctx1 = document.getElementById("chartToneladasDia");
  const ctx2 = document.getElementById("chartImporteDia");

  const mapT = {};
  const mapI = {};

  filteredData.forEach(r => {
    const fecha = r.Fecha;
    if (!fecha) return;
    const cant = Number(r.Cantidad) || 0;
    const imp  = Number(r.Importe) || 0;

    if (r.Unidades === "T") {
      mapT[fecha] = (mapT[fecha] || 0) + cant;
    }
    mapI[fecha] = (mapI[fecha] || 0) + imp;
  });

  const labelsT = Object.keys(mapT);
  const dataT   = Object.values(mapT);
  const labelsI = Object.keys(mapI);
  const dataI   = Object.values(mapI);

  if (chartT) chartT.destroy();
  if (chartI) chartI.destroy();

  chartT = new Chart(ctx1, {
    type: "line",
    data: {
      labels: labelsT,
      datasets: [{
        label: "Toneladas",
        data: dataT,
        borderColor: "#66fcf1",
        backgroundColor: "rgba(102,252,241,0.15)",
        tension: 0.2
      }]
    },
    options: { plugins:{legend:{labels:{color:"#c5c6c7"}}}, scales:{x:{ticks:{color:"#c5c6c7"}},y:{ticks:{color:"#c5c6c7"}}}}
  });

  chartI = new Chart(ctx2, {
    type: "line",
    data: {
      labels: labelsI,
      datasets: [{
        label: "Importe",
        data: dataI,
        borderColor: "#45a29e",
        backgroundColor: "rgba(69,162,158,0.15)",
        tension: 0.2
      }]
    },
    options: { plugins:{legend:{labels:{color:"#c5c6c7"}}}, scales:{x:{ticks:{color:"#c5c6c7"}},y:{ticks:{color:"#c5c6c7"}}}}
  });
}
</script>

</body>
</html>
