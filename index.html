<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Cemento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { background:#0b0c10; color:#c5c6c7; font-family:system-ui; margin:0; }

    /* LOGIN */
    #loginScreen {
      position:fixed; inset:0; background:#0b0c10;
      display:flex; align-items:center; justify-content:center; z-index:9999;
    }
    .login-box {
      background:#1f2833; border:1px solid #45a29e; border-radius:12px;
      padding:40px; width:320px; text-align:center;
    }
    .login-box h2 { color:#66fcf1; margin-bottom:24px; font-size:1.4rem; }
    .login-box input {
      width:100%; padding:10px; margin-bottom:12px; box-sizing:border-box;
      background:#0b0c10; border:1px solid #45a29e55; color:#c5c6c7;
      border-radius:6px; font-size:1rem;
    }
    .login-box button {
      width:100%; padding:10px; background:#45a29e; border:none;
      border-radius:6px; color:#0b0c10; font-weight:700; font-size:1rem; cursor:pointer;
    }
    .login-box button:hover { background:#66fcf1; }
    #loginError { color:#e74c3c; font-size:0.85rem; margin-top:8px; display:none; }

    /* DASHBOARD */
    #dashboard { display:none; }
    .navbar { background:#1f2833; border-bottom:1px solid #45a29e33; }
    .card { background:#1f2833; border:1px solid #45a29e33; }
    .kpi-card { background:#1f2833; border:1px solid #45a29e; border-radius:8px; padding:12px 16px; }
    .kpi-value { font-size:2rem; font-weight:600; color:#66fcf1; }
    .kpi-label { font-size:0.85rem; text-transform:uppercase; color:#45a29e; }
    .chart-container { height:260px; }
    .table thead th { background:#1f2833; color:#66fcf1; position:sticky; top:0; }
    .form-select { background:#0b0c10; border:1px solid #45a29e55; color:#c5c6c7; }
    .form-select:focus { background:#0b0c10; color:#c5c6c7; border-color:#45a29e; box-shadow:none; }
    #loadingMsg { text-align:center; padding:40px; color:#45a29e; display:none; }
    .badge-t  { background:#66fcf122; color:#66fcf1; border:1px solid #66fcf144; border-radius:4px; padding:1px 6px; font-size:0.75rem; }
    .badge-un { background:#45a29e22; color:#45a29e; border:1px solid #45a29e44; border-radius:4px; padding:1px 6px; font-size:0.75rem; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <i class="fa-solid fa-chart-line fa-2x mb-3" style="color:#66fcf1"></i>
    <h2>Dashboard Cemento</h2>
    <input type="text" id="loginUser" placeholder="Usuario">
    <input type="password" id="loginPass" placeholder="Contraseña">
    <button onclick="checkLogin()">Entrar</button>
    <div id="loginError">Usuario o contraseña incorrectos</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <nav class="navbar navbar-dark px-3 py-2">
    <span class="navbar-brand d-flex align-items-center">
      <i class="fa-solid fa-chart-line me-2 text-info"></i>Dashboard Cemento
    </span>
    <span id="lastUpdate" class="text-secondary small"></span>
  </nav>

  <div class="container-fluid py-3">
    <div id="loadingMsg"><i class="fa-solid fa-spinner fa-spin fa-2x mb-2"></i><br>Cargando datos...</div>

    <div id="mainContent" style="display:none">
      <!-- KPIs -->
      <div class="row g-3 mb-3">
        <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-label"><i class="fa-solid fa-weight-hanging me-1"></i>Toneladas (T)</div><div id="kpiToneladas" class="kpi-value">0</div></div></div>
        <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-label"><i class="fa-solid fa-boxes-stacked me-1"></i>Unidades (UN)</div><div id="kpiUnidades" class="kpi-value">0</div></div></div>
        <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-label"><i class="fa-solid fa-bag-shopping me-1"></i>Sacos (SAC)</div><div id="kpiSacos" class="kpi-value">0</div></div></div>
        <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-label"><i class="fa-solid fa-euro-sign me-1"></i>Importe</div><div id="kpiImporte" class="kpi-value">0 €</div></div></div>
        <div class="col-6 col-md-3"><div class="kpi-card"><div class="kpi-label"><i class="fa-solid fa-receipt me-1"></i>Albaranes</div><div id="kpiAlbaranes" class="kpi-value">0</div></div></div>
      </div>

      <!-- Filtros -->
      <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span><i class="fa-solid fa-filter me-1"></i>Filtros</span>
          <button class="btn btn-sm btn-outline-secondary" onclick="resetFiltros()">Limpiar</button>
        </div>
        <div class="card-body">
          <div class="row g-2">
            <div class="col-6 col-md-3"><select id="filtroCentro"       class="form-select form-select-sm"></select></div>
            <div class="col-6 col-md-3"><select id="filtroEmpresa"      class="form-select form-select-sm"></select></div>
            <div class="col-6 col-md-3"><select id="filtroMatricula"    class="form-select form-select-sm"></select></div>
            <div class="col-6 col-md-3"><select id="filtroObra"         class="form-select form-select-sm"></select></div>
            <div class="col-6 col-md-3"><select id="filtroTransportista" class="form-select form-select-sm"></select></div>
            <div class="col-6 col-md-3"><select id="filtroUnidades"     class="form-select form-select-sm"></select></div>
          </div>
        </div>
      </div>

      <!-- Gráficos -->
      <div class="row g-3 mb-3">
        <div class="col-lg-6"><div class="card"><div class="card-header">Toneladas por día</div><div class="card-body p-2"><div class="chart-container"><canvas id="chartT"></canvas></div></div></div></div>
        <div class="col-lg-6"><div class="card"><div class="card-header">Importe por día</div><div class="card-body p-2"><div class="chart-container"><canvas id="chartI"></canvas></div></div></div></div>
      </div>

      <!-- Tabla -->
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Detalle</span><span id="tablaInfo" class="text-secondary small"></span>
        </div>
        <div class="card-body p-0 table-responsive" style="max-height:400px;overflow-y:auto;">
          <table class="table table-dark table-sm table-hover mb-0">
            <thead><tr><th>Fecha</th><th>Albarán</th><th>Centro</th><th>Obra</th><th>Artículo</th><th>Matrícula</th><th>Cantidad</th><th>Und</th><th>Importe</th><th>Empresa</th></tr></thead>
            <tbody id="tablaBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const EXCEL_URL = "https://docs.google.com/spreadsheets/d/1gAcHAvF1jGVEasiahCM5P3dUKKwfEU0DoR8HFwUDx_s/export?format=xlsx&gid=1514026503";
let rawData = [], filteredData = [], cT = null, cI = null;

// ── LOGIN ──────────────────────────────────────────────
function checkLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if (u === 'cacsa' && p === '1954*') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    sessionStorage.setItem('auth', 'ok');
    cargarExcel();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') checkLogin();
});

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('auth') === 'ok') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    cargarExcel();
  }
});

// ── CARGA ──────────────────────────────────────────────
async function cargarExcel() {
  document.getElementById('loadingMsg').style.display = 'block';
  try {
    const res = await fetch(EXCEL_URL);
    const buf = await res.arrayBuffer();
    const wb  = XLSX.read(buf, { type:'array', cellDates:true });
    rawData   = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });

    const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s/g,'').toLowerCase();
    const keys = Object.keys(rawData[0] || {});
    const matrKey = keys.find(k => norm(k) === 'matricula');

    rawData.forEach(r => {
      // Fecha
      if (r.Fecha instanceof Date) r.Fecha = r.Fecha.toLocaleDateString('es-ES');
      else if (typeof r.Fecha === 'number') {
        const d = XLSX.SSF.parse_date_code(r.Fecha);
        r.Fecha = `${String(d.d).padStart(2,'0')}/${String(d.m).padStart(2,'0')}/${d.y}`;
      }
      // Trim espacios
      ['Unidades','Centro','Empresa','Obra','Nombre obra','Artículo','Articulo','Transportista'].forEach(k => {
        if (typeof r[k] === 'string') r[k] = r[k].trim();
      });
      // Matrícula
      r._mat = matrKey ? String(r[matrKey] || '').trim() : '';
      // Números
      if (typeof r.Cantidad === 'string') r.Cantidad = r.Cantidad.replace(',','.');
      if (typeof r.Importe  === 'string') r.Importe  = r.Importe.replace(',','.');
    });

    document.getElementById('lastUpdate').textContent = 'Actualizado: ' + new Date().toLocaleString('es-ES');
    filteredData = [...rawData];
    iniciar();
  } catch(e) {
    document.getElementById('loadingMsg').innerHTML = '<i class="fa-solid fa-triangle-exclamation text-warning"></i> Error cargando datos.';
    console.error(e);
  }
}

function iniciar() {
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  populateFilters();
  attachEvents();
  renderAll();
}

// ── FILTROS ────────────────────────────────────────────
function populateFilters() {
  const s = { centro:new Set(), empresa:new Set(), mat:new Set(), obra:new Set(), trans:new Set(), und:new Set() };
  rawData.forEach(r => {
    if (r.Centro) s.centro.add(r.Centro);
    if (r.Empresa) s.empresa.add(r.Empresa);
    if (r._mat) s.mat.add(r._mat);
    if (r['Nombre obra']) s.obra.add(r['Nombre obra']);
    if (r.Transportista) s.trans.add(r.Transportista);
    if (r.Unidades) s.und.add(r.Unidades);
  });
  fillSelect('filtroCentro',        [...s.centro].sort(), 'Centro');
  fillSelect('filtroEmpresa',       [...s.empresa].sort(),'Empresa');
  fillSelect('filtroMatricula',     [...s.mat].sort(),    'Matrícula');
  fillSelect('filtroObra',          [...s.obra].sort(),   'Nombre obra');
  fillSelect('filtroTransportista', [...s.trans].sort(),  'Transportista');
  fillSelect('filtroUnidades',      [...s.und].sort(),    'Unidades');
}

function fillSelect(id, arr, label) {
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="">Todos (${label})</option>`;
  arr.forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; sel.appendChild(o); });
}

function attachEvents() {
  ['filtroCentro','filtroEmpresa','filtroMatricula','filtroObra','filtroTransportista','filtroUnidades'].forEach(id =>
    document.getElementById(id).addEventListener('change', applyFilters)
  );
}

function resetFiltros() {
  ['filtroCentro','filtroEmpresa','filtroMatricula','filtroObra','filtroTransportista','filtroUnidades'].forEach(id =>
    document.getElementById(id).value = ''
  );
  applyFilters();
}

function applyFilters() {
  const c = document.getElementById('filtroCentro').value;
  const e = document.getElementById('filtroEmpresa').value;
  const m = document.getElementById('filtroMatricula').value;
  const o = document.getElementById('filtroObra').value;
  const t = document.getElementById('filtroTransportista').value;
  const u = document.getElementById('filtroUnidades').value;
  filteredData = rawData.filter(r =>
    (!c || r.Centro === c) &&
    (!e || r.Empresa === e) &&
    (!m || r._mat === m) &&
    (!o || r['Nombre obra'] === o) &&
    (!t || r.Transportista === t) &&
    (!u || r.Unidades === u)
  );
  renderAll();
}

// ── RENDER ─────────────────────────────────────────────
function renderAll() { updateKPIs(); updateCharts(); renderTable(); }

function updateKPIs() {
  let ton=0, uni=0, sac=0, imp=0; const alb=new Set();
  filteredData.forEach(r => {
    const c = Number(r.Cantidad)||0;
    imp += Number(r.Importe)||0;
    const u = (r.Unidades||'').trim();
    if (u==='T')   ton+=c;
    if (u==='UN')  uni+=c;
    if (u==='SAC') sac+=c;
    const a = r.Albarán||r.Albaran; if(a) alb.add(a);
  });
  document.getElementById('kpiToneladas').textContent = ton.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('kpiUnidades').textContent  = uni.toLocaleString('es-ES',{maximumFractionDigits:0});
  document.getElementById('kpiSacos').textContent     = sac.toLocaleString('es-ES',{maximumFractionDigits:0});
  document.getElementById('kpiImporte').textContent   = imp.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  document.getElementById('kpiAlbaranes').textContent = alb.size || filteredData.length;
}

function updateCharts() {
  const mT={}, mI={};
  filteredData.forEach(r => {
    const f=String(r.Fecha||'').trim(); if(!f) return;
    const imp=Number(String(r.Importe||0).replace(',','.'))||0;
    mI[f]=(mI[f]||0)+imp;
    if(r.Unidades==='T') mT[f]=(mT[f]||0)+(Number(String(r.Cantidad||0).replace(',','.'))||0);
  });
  const opts = () => ({ responsive:true, maintainAspectRatio:false, animation:false,
    plugins:{legend:{labels:{color:'#c5c6c7'}}},
    scales:{x:{ticks:{color:'#c5c6c7',maxTicksLimit:12},grid:{color:'#ffffff11'}},y:{ticks:{color:'#c5c6c7'},grid:{color:'#ffffff11'}}}
  });
  if(cT){cT.destroy();cT=null;} if(cI){cI.destroy();cI=null;}
  cT = new Chart(document.getElementById('chartT'),{type:'line',data:{labels:Object.keys(mT),datasets:[{label:'Toneladas',data:Object.values(mT),borderColor:'#66fcf1',backgroundColor:'rgba(102,252,241,0.1)',tension:0.2,pointRadius:2}]},options:opts()});
  cI = new Chart(document.getElementById('chartI'),{type:'line',data:{labels:Object.keys(mI),datasets:[{label:'Importe',data:Object.values(mI),borderColor:'#45a29e',backgroundColor:'rgba(69,162,158,0.1)',tension:0.2,pointRadius:2}]},options:opts()});
}

function renderTable() {
  const MAX=500, rows=filteredData.slice(0,MAX);
  document.getElementById('tablaInfo').textContent = filteredData.length>MAX ? `Mostrando ${MAX} de ${filteredData.length}` : `${filteredData.length} filas`;
  document.getElementById('tablaBody').innerHTML = rows.map(r => {
    const u = r.Unidades==='T'?'<span class="badge-t">T</span>':r.Unidades==='UN'?'<span class="badge-un">UN</span>':(r.Unidades||'');
    return `<tr><td>${r.Fecha||''}</td><td>${r.Albarán||r.Albaran||''}</td><td>${r.Centro||''}</td><td>${r['Nombre obra']||r.Obra||''}</td><td>${r.Artículo||r.Articulo||''}</td><td>${r._mat||''}</td><td>${r.Cantidad||0}</td><td>${u}</td><td>${Number(r.Importe||0).toLocaleString('es-ES',{minimumFractionDigits:2})}</td><td>${r.Empresa||''}</td></tr>`;
  }).join('');
}
</script>
</body>
</html>
